<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script type="importmap">
{
  "imports": {
    "@babylonjs/core": "./node_modules/@babylonjs/core/index.js",
    "@babylonjs/core/": "./node_modules/@babylonjs/core/",
    "@babylonjs/loaders": "./node_modules/@babylonjs/loaders/index.js",
    "@babylonjs/loaders/": "./node_modules/@babylonjs/loaders/"
  }
}
</script>
<script type="module">
import { Color3, Color4, DirectionalLight, Effect, Engine, HemisphericLight, KeyboardEventTypes, Matrix, MeshBuilder, MirrorTexture, PBRMaterial, Plane, PointerEventTypes, Quaternion, Scene, ShaderMaterial, ShadowGenerator, Texture, Tools, TransformNode, UniversalCamera, Vector3 } from "@babylonjs/core";
import { MaterialPluginBase } from "@babylonjs/core/Materials/materialPluginBase.js";
import { applyDiffuse, applyDiffuseMapsFromUrls, applyKaBlendToDiffuse, applySmoothShading, convertMaterialsToLambert, loadObjMtl } from "./loadObjMtl.js";
import { myRunRenderLoop, useRightHandedSystem } from "./common.js";

const MODEL_DIR = "./model/";

const AMBIENT_LIGHT_COEF = 1.0;
const DIRECTIONAL_LIGHT_COEF = 1.0;

const GROUND_MODEL_SCALE = 0.033;
const GROUND_PLANE_SIZE = 200 * GROUND_MODEL_SCALE;
const WATER_METALNESS = 0.05;
const WATER_ROUGHNESS = 0.15;

const WAVE_ANIM_SPEED = 1.0;

let dispMesh = false;
let meshObjRoot = null;
let waveType = 0;

// 反射(mirror)と影(地面)で異なった振幅を設定できるように
const REFLECT_RIPPLE_AMPLITUDE_X = 0.001 * 20;
const REFLECT_RIPPLE_AMPLITUDE_Y = 0.001;
const SHADOW_RIPPLE_AMPLITUDE_X = 0.001 * 20;
const SHADOW_RIPPLE_AMPLITUDE_Y = 0.001;

const rippleState = { waveType: 0, elapse: 0 };

const WATER_RIPPLE_UNIFORM_DECL = /*glsl*/`
  uniform float uWaveType; // 波モード種別（0/1/2）
  uniform float uFrequencyX, uFrequencyY; // ピクセルベースゆらぎの周波数
  uniform float uSpeedX, uSpeedY; // 時間に対する伝播速度係数
  uniform float uElapse; // アニメ時間（JS側で増分）
  uniform float uNoiseScale; // ノイズ座標スケール
  uniform float uNoiseTimeScale; // ノイズの時間ドリフト
  uniform float uNoiseStrength; // 位相ノイズの強さ
  uniform float uNoiseAmplitude; // 振幅ノイズの強さ
`;

const WATER_RIPPLE_FUNCTIONS = /*glsl*/`
  float rippleRandom(vec2 st) { // 擬似乱数（0～1）
    return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
  }

  float rippleSmoothNoise(vec2 st) { // 格子補間ノイズ
    vec2 i = floor(st); // セル原点
    vec2 f = fract(st); // セル内座標
    float a = rippleRandom(i); // 四隅乱数
    float b = rippleRandom(i + vec2(1.0, 0.0));
    float c = rippleRandom(i + vec2(0.0, 1.0));
    float d = rippleRandom(i + vec2(1.0, 1.0));
    vec2 u = f * f * (3.0 - 2.0 * f); // smoothstep
    return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y; // 双線形風
  }

  float rippleNoise(vec2 st, float scale) { // 4オクターブFBM風
    float value = 0.0;
    float amplitude = 1.0;
    float frequency = 1.0;
    for (int i = 0; i < 4; i++) {
      value += amplitude * rippleSmoothNoise(st * frequency * scale);
      amplitude *= 0.5;
      frequency *= 2.0;
    }
    return value;
  }

  float rippleWave(float x, float y, float freq, float amp, float speed, float time, float dx, float dy) { // Threeと同型
    if (uWaveType >= 0.5 && uWaveType < 1.5) { // 純sinの重ね用
      float wave = sin(x * dx * freq + y * dy * freq + time * speed);
      return wave * amp;
    } else { // ノイズ変調（Type2向け。Type1は上でreturn）
      vec2 noiseCoord = vec2(x * dx * uNoiseScale, y * dy * uNoiseScale + time * uNoiseTimeScale);
      float noiseValue = rippleNoise(noiseCoord, 1.0) * uNoiseStrength;
      float wave = sin(x * dx * freq + y * dy * freq + time * speed + noiseValue * 3.14159);
      return wave * amp * (1.0 + noiseValue * uNoiseAmplitude);
    }
  }

  vec2 waterRippleOffset(vec2 amplitude) {
    float offsetX = 0.0;
    if (uFrequencyX != 0.0) {
      if (uWaveType < 0.5) {
        offsetX = sin(gl_FragCoord.x * uFrequencyX + uElapse * uSpeedX) * amplitude.x;
      } else {
        offsetX += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX, amplitude.x, uSpeedX, uElapse, 1.0, 0.0);
        offsetX += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX * 0.7, amplitude.x * 0.5, uSpeedX * 0.8, uElapse, 0.7, 0.7);
        offsetX += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyX * 1.5, amplitude.x * 0.3, uSpeedX * 1.2, uElapse, 0.3, 0.9);
      }
    }
    float offsetY = 0.0;
    if (uFrequencyY != 0.0) {
      if (uWaveType < 0.5) {
        offsetY = cos(gl_FragCoord.y * uFrequencyY + uElapse * uSpeedY) * amplitude.y;
      } else {
        offsetY += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY, amplitude.y, uSpeedY, uElapse, 0.0, 1.0);
        offsetY += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY * 0.7, amplitude.y * 0.5, uSpeedY * 0.8, uElapse, 0.7, 0.7);
        offsetY += rippleWave(gl_FragCoord.x, gl_FragCoord.y, uFrequencyY * 1.5, amplitude.y * 0.3, uSpeedY * 1.2, uElapse, 0.3, 0.9);
      }
    }
    return vec2(offsetX, offsetY);
  }
`;

// 水面PBRの影ゆらぎ専用（反射ShaderMaterialには含めない）
const WATER_SHADOW_RIPPLE_FUNCTIONS = /*glsl*/`
  vec4 perturbLightPos(vec4 vPositionFromLight) {
    vPositionFromLight.xy += waterRippleOffset(vec2(uShadowAmplitudeX, uShadowAmplitudeY)) * vPositionFromLight.w;
    return vPositionFromLight;
  }
`;

class WaterShadowRipplePlugin extends MaterialPluginBase {
  constructor(material, state) {
    super(material, "WaterShadowRipple", 200, {}, true, false);
    this._state = state;
    this.registerForExtraEvents = true; // これがないとhardBindForSubMeshが呼ばれない
    this._enable(true); // プラグインを有効化し、シェーダ再生成の対象にする
  }

  // PBRマテリアルのUniform Buffer（UBO）に載せるfloat一覧を宣言
  getUniforms() {
    return {
      ubo: [
        { name: "uWaveType", size: 1, type: "float" },
        { name: "uFrequencyX", size: 1, type: "float" },
        { name: "uFrequencyY", size: 1, type: "float" },
        { name: "uShadowAmplitudeX", size: 1, type: "float" },
        { name: "uShadowAmplitudeY", size: 1, type: "float" },
        { name: "uSpeedX", size: 1, type: "float" },
        { name: "uSpeedY", size: 1, type: "float" },
        { name: "uElapse", size: 1, type: "float" },
        { name: "uNoiseScale", size: 1, type: "float" },
        { name: "uNoiseTimeScale", size: 1, type: "float" },
        { name: "uNoiseStrength", size: 1, type: "float" },
        { name: "uNoiseAmplitude", size: 1, type: "float" },
      ],
    };
  }

  // フラグメントシェーダ向けに、Babylon標準PBRシェーダへコード片を差し込むフック
  // computeShadowWithPCF1/3/5(vPositionFromLightN, ...)の呼び出しを検出し、perturbLightPosで包む
  getCustomCode(shaderType) {
    if (shaderType !== "fragment") return null;
    // customCodeはprocessCodeAfterIncludes（include 展開後）で走る。
    // clipSpace行の一括置換は同一文字列が多数あるため最初の1箇所しか効かないので、
    // lightFragment内のPCF呼び出しだけperturbLightPosで包む（ThreeのshadowCoord補正と同趣旨）。
    return {
      // shadowsFragmentFunctionsより前だとMaterial UBOのuniformが未宣言になる
      CUSTOM_FRAGMENT_DEFINITIONS: WATER_RIPPLE_FUNCTIONS + WATER_SHADOW_RIPPLE_FUNCTIONS,
      "!shadow=computeShadowWithPCF5\\(vPositionFromLight(\\d+),": // キーが"!"で始まると、正規表現マッチ＋置換
        "shadow=computeShadowWithPCF5(perturbLightPos(vPositionFromLight$1),",
      "!shadow=computeShadowWithPCF3\\(vPositionFromLight(\\d+),": // キーが"!"で始まると、正規表現マッチ＋置換
        "shadow=computeShadowWithPCF3(perturbLightPos(vPositionFromLight$1),",
      "!shadow=computeShadowWithPCF1\\(vPositionFromLight(\\d+),": // キーが"!"で始まると、正規表現マッチ＋置換
        "shadow=computeShadowWithPCF1(perturbLightPos(vPositionFromLight$1),",
    };
  }

  // UBOに毎回値を書き込む内部ヘルパー（オーバーライドではない）
  _updateRippleUniforms(uniformBuffer) {
    const s = this._state;
    uniformBuffer.updateFloat("uWaveType", s.waveType);
    uniformBuffer.updateFloat("uFrequencyX", 0.1);
    uniformBuffer.updateFloat("uFrequencyY", 0.1);
    uniformBuffer.updateFloat("uShadowAmplitudeX", SHADOW_RIPPLE_AMPLITUDE_X);
    uniformBuffer.updateFloat("uShadowAmplitudeY", SHADOW_RIPPLE_AMPLITUDE_Y);
    uniformBuffer.updateFloat("uSpeedX", 0.5);
    uniformBuffer.updateFloat("uSpeedY", 0.5);
    uniformBuffer.updateFloat("uElapse", s.elapse);
    uniformBuffer.updateFloat("uNoiseScale", 0.02);
    uniformBuffer.updateFloat("uNoiseTimeScale", 0.1);
    uniformBuffer.updateFloat("uNoiseStrength", 0.2);
    uniformBuffer.updateFloat("uNoiseAmplitude", 0.5);
  }

  // サブメッシュごとに「必ず」UBOを埋める（registerForExtraEvents経由で呼ばれる）
  hardBindForSubMesh(uniformBuffer) {
    this._updateRippleUniforms(uniformBuffer);
  }

  // 通常のマテリアルバインド時に呼ばれる
  bindForSubMesh(uniformBuffer) {
    this._updateRippleUniforms(uniformBuffer);
  }
}

// Threeの15glslのWaterRippleReflectorShaderに相当（フラグメントで反射UVゆらぎ）
Effect.ShadersStore["waterRippleReflectVertexShader"] = /*glsl*/`
  precision highp float; // フラグメントと同等にfloatを高精度へ

  attribute vec3 position; // メッシュのローカル頂点座標（Babylon既定のattribute名）

  uniform mat4 worldViewProjection; // ローカル → クリップ空間の合成行列（描画）
  uniform mat4 world; // ローカル → ワールド
  uniform mat4 view; // ワールド → ビュー（カメラ）空間
  uniform mat4 textureMatrix; // MirrorTexture.getReflectionTextureMatrix()由来の投射用行列（Threeの同名uniformに対応）

  varying vec4 vTextureCoord; // フラグメントへ：反射サンプル用の同次座標（実装では主にxy,zを使用）

  void main(void) { // 各頂点1回：ワールド座標経由で反射用ベクトルを渡す
    vec4 worldPos = world * vec4(position, 1.0); // ワールド原点基準の点
    vTextureCoord = textureMatrix * (view * worldPos); // view空間まで持ち込んだ上で投射行列へ（エンジン仕様）
    gl_Position = worldViewProjection * vec4(position, 1.0); // 画面上のクリップ座標
  }
`;
Effect.ShadersStore["waterRippleReflectFragmentShader"] = /*glsl*/`
  precision highp float; // sampler演算などfloat精度指定（ESフラグメント必須に近い）

  uniform vec3 color; // オーバーレイティント（Threeと同じuniform名）
  uniform sampler2D tDiffuse; // MirrorTextureをバインドする反射カラー
  uniform float uAmplitudeX, uAmplitudeY; // サンプルUVへ足すゆらぎの大きさ

  varying vec4 vTextureCoord; // 頂点シェーダからの同次座標（Babylonはzで除算してUV化）

  ${WATER_RIPPLE_UNIFORM_DECL}
  ${WATER_RIPPLE_FUNCTIONS}

  float blendOverlay(float base, float blend) {
    return (base < 0.5 ? (2.0 * base * blend) : (1.0 - 2.0 * (1.0 - base) * (1.0 - blend)));
  }

  vec3 blendOverlay(vec3 base, vec3 blend) { // RGB各ch
    return vec3(
      blendOverlay(base.r, blend.r),
      blendOverlay(base.g, blend.g),
      blendOverlay(base.b, blend.b)
    );
  }

  void main(void) { // ピクセルごと：オフセット計算 → 反射テクスチャ取得
    vec2 ripple = waterRippleOffset(vec2(uAmplitudeX, uAmplitudeY));

    float denom = vTextureCoord.z; // Babylon反射マットでは透視除算にzを使う（Threeのwとは役割差に注意）
    if (abs(denom) < 1e-6) { // 除算ブレーキ：特異点ではティント単色
      gl_FragColor = vec4(color, 1.0);
      return;
    }
    vec2 uv = vTextureCoord.xy / denom; // 手動で射影UV化（texture2DProj相当を自前で）
    uv.y = 1.0 - uv.y; // テクスチャ空間をエンジン慣習に合わせY反転
    uv += ripple; // 波で縦・横方向シフト

    vec4 base = texture2D(tDiffuse, uv); // 通常2Dサンプル（歪みは既にUVに含む）
    gl_FragColor = vec4(blendOverlay(base.rgb, color), 1.0); // オーバーレイ合成・不透明
  }
`;

let image_loaded = false;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const engine = new Engine(canvas3d, true);
engine.setHardwareScalingLevel(1 / window.devicePixelRatio);

const scene = new Scene(engine);
if (useRightHandedSystem) scene.useRightHandedSystem = true;
scene.clearColor = new Color4(0.0, 0.0, 1.0, 1.0);

const lookY = 0.0;
const camera = new UniversalCamera("cam", new Vector3(0.0, lookY, 7.5), scene);
camera.minZ = 0.1;
camera.maxZ = 100.0;
camera.fov = Math.PI / 4.0; // 45deg
camera.setTarget(new Vector3(0.0, lookY, 0.0));

const scenePivot = new TransformNode("pivot", scene);
scenePivot.position.set(0.0, lookY, 0.0);

let lightX = useRightHandedSystem ? -3.0 : 3.0;
let lightY = 7.5;
let lightZ = 3.5;
const LIGHT_STEP = 0.1;

let rotateX = 25.0;
let rotateY = 25.0;

const lightHelper = new TransformNode("lightHelper", scene);
lightHelper.parent = scenePivot;

const mirror = new MirrorTexture("mirror", 1024, scene, true, undefined, Texture.BILINEAR_SAMPLINGMODE, true);
mirror.clearColor = new Color4(0.0, 0.0, 1.0, 1.0);
mirror.level = 1.5;

// 平坦な反射面（ゆらぎはシェーダ内のみ。Three.js 15glslと同系）
const reflectPlane = MeshBuilder.CreateGround(
  "rippleReflect",
  { width: GROUND_PLANE_SIZE, height: GROUND_PLANE_SIZE, subdivisions: 1 },
  scene
);
reflectPlane.position.y = 0.01;
reflectPlane.setParent(scenePivot);

const rippleMat = new ShaderMaterial(
  "rippleReflectMat",
  scene,
  { vertex: "waterRippleReflect", fragment: "waterRippleReflect" },
  {
    attributes: ["position", "normal", "uv"],
    uniforms: [
      "worldViewProjection",
      "world",
      "view",
      "textureMatrix",
      "color",
      "uWaveType",
      "uFrequencyX",
      "uFrequencyY",
      "uAmplitudeX",
      "uAmplitudeY",
      "uSpeedX",
      "uSpeedY",
      "uElapse",
      "uNoiseScale",
      "uNoiseTimeScale",
      "uNoiseStrength",
      "uNoiseAmplitude",
    ],
    samplers: ["tDiffuse"],
    needAlphaBlending: false,
    needAlphaTesting: false,
  }
);
rippleMat.backFaceCulling = true;
rippleMat.setTexture("tDiffuse", mirror);
rippleMat.setColor3("color", new Color3(127 / 255, 127 / 255, 127 / 255));
rippleMat.setFloat("uWaveType", 0);
rippleMat.setFloat("uFrequencyX", 0.1);
rippleMat.setFloat("uFrequencyY", 0.1);
rippleMat.setFloat("uAmplitudeX", REFLECT_RIPPLE_AMPLITUDE_X);
rippleMat.setFloat("uAmplitudeY", REFLECT_RIPPLE_AMPLITUDE_Y);
rippleMat.setFloat("uSpeedX", 0.5);
rippleMat.setFloat("uSpeedY", 0.5);
rippleMat.setFloat("uElapse", 0.0);
rippleMat.setFloat("uNoiseScale", 0.02);
rippleMat.setFloat("uNoiseTimeScale", 0.1);
rippleMat.setFloat("uNoiseStrength", 0.2);
rippleMat.setFloat("uNoiseAmplitude", 0.5);
reflectPlane.material = rippleMat;

// 半透明の水面オーバーレイ（Threeのwater MeshStandardMaterialに相当）
const water = MeshBuilder.CreateGround(
  "waterTint",
  { width: GROUND_PLANE_SIZE, height: GROUND_PLANE_SIZE, subdivisions: 1 },
  scene
);
water.position.y = 0.02;
water.setParent(scenePivot);
water.renderingGroupId = 0;

const waterMaterial = new PBRMaterial("waterTintMat", scene);
waterMaterial.metallic = WATER_METALNESS;
waterMaterial.roughness = WATER_ROUGHNESS;
waterMaterial.albedoColor = new Color3(128 / 255, 128 / 255, 128 / 255);
waterMaterial.alpha = 0.55;
waterMaterial.transparencyMode = 2;
waterMaterial.backFaceCulling = false;
waterMaterial.reflectionTexture = mirror;
waterMaterial.reflectionTexture.level = 1.45;
water.material = waterMaterial;
water.receiveShadows = true;
const waterShadowRipple = new WaterShadowRipplePlugin(waterMaterial, rippleState);
waterMaterial.markDirty();

function refreshMirrorRenderList() {
  mirror.renderList.length = 0;
  const skip = new Set([reflectPlane, water]);
  for (const m of scene.meshes) {
    if (!m || skip.has(m)) continue;
    if (m.getClassName?.() !== "Mesh") continue;
    if (!m.getTotalVertices || m.getTotalVertices() === 0) continue;
    mirror.renderList.push(m);
  }
}

const hemi = new HemisphericLight("h", new Vector3(0.0, 1.0, 0.0), scene);
hemi.diffuse = Color3.White();
hemi.groundColor = Color3.White();
hemi.intensity = 0.5 * AMBIENT_LIGHT_COEF;

const light = new DirectionalLight("dir", new Vector3(0.0, -1.0, 0.0), scene);
light.intensity = 1.0 * DIRECTIONAL_LIGHT_COEF;
light.shadowMinZ = 0.5;
light.shadowMaxZ = 40.0;
const shadowExtent = 12.0 * (GROUND_PLANE_SIZE / 20.0);
light.shadowFrustumSize = Math.max(shadowExtent, 8);

const shadowGen = new ShadowGenerator(2048, light);
shadowGen.filter = ShadowGenerator.FILTER_PCF;
shadowGen.filteringQuality = ShadowGenerator.QUALITY_HIGH; // 5×5 PCF
shadowGen.bias = 0.0008;

(async () => {
  const specs = [
    { name: "witch", scale: 0.015, pos: [0.0, 0.05, 0.0], diffuse: 0.8 },
    { name: "cat", scale: 0.005, pos: [useRightHandedSystem ? -1.5 : 1.5, 0.4, 0.5] },
    { name: "swan", scale: 0.005, pos: [useRightHandedSystem ? 2.0 : -2.0, 2.0, 0.5], kaBlend: 0.35 },
    { name: "mesh", scale: GROUND_MODEL_SCALE, pos: [0.0, 1.2, -1.5] },
  ];
  try {
    for (const s of specs) {
      const root = await loadObjMtl(scene, MODEL_DIR, s.name);
      convertMaterialsToLambert(root);
      if (s.name === "witch") {
        applyDiffuseMapsFromUrls(scene, root, [
          { materialName: "kao", url: "texture/kao.jpg" },
          { materialName: "body", url: "texture/body.jpg" },
          { materialName: "fire", url: "texture/fire.jpg" },
        ]);
      }
      if (s.name === "mesh") {
        applyDiffuseMapsFromUrls(scene, root, [
          { materialName: "mat1", url: "texture/mesh.png" },
        ]);
      }
      if (s.diffuse !== undefined) applyDiffuse(root, new Color3(s.diffuse, s.diffuse, s.diffuse));
      if (s.kaBlend !== undefined) applyKaBlendToDiffuse(root, s.kaBlend);
      applySmoothShading(root);
      root.scaling.copyFromFloats(s.scale, s.scale, s.scale);
      root.position.set(s.pos[0], s.pos[1], s.pos[2]);
      const castShadow = !s.ground;
      const meshes = root.getChildMeshes ? root.getChildMeshes(true) : [];
      if (root.getClassName && root.getClassName() === "Mesh") meshes.push(root);
      for (const mesh of meshes) {
        if (castShadow) shadowGen.addShadowCaster(mesh);
        mesh.receiveShadows = true;
      }
      root.setParent(scenePivot);
      if (s.name === "mesh") meshObjRoot = root;
    }
    if (meshObjRoot) meshObjRoot.setEnabled(dispMesh);
    refreshMirrorRenderList();
    image_loaded = true;
  } catch (e) {
    console.error(e);
  }
})();

canvas3d.tabIndex = engine.canvasTabIndex;
canvas3d.focus({ preventScroll: true });
const keys = new Set();
scene.onKeyboardObservable.add((kbInfo) => {
  const code = kbInfo.event.code;
  if (kbInfo.type === KeyboardEventTypes.KEYDOWN) {
    keys.add(code);
  } else if (kbInfo.type === KeyboardEventTypes.KEYUP) {
    keys.delete(code);
  }
});

let elapse = 0;

myRunRenderLoop(engine, () => (image_loaded ? 30/*フレーム*/ : 10/*フレーム*/), () => {
  if (keys.has("ArrowUp")) lightY += LIGHT_STEP;
  if (keys.has("ArrowDown")) lightY -= LIGHT_STEP;
  if (keys.has("ArrowLeft")) lightX -= useRightHandedSystem ? LIGHT_STEP : -LIGHT_STEP;
  if (keys.has("ArrowRight")) lightX += useRightHandedSystem ? LIGHT_STEP : -LIGHT_STEP;
  if (keys.has("KeyZ")) lightZ += LIGHT_STEP;
  if (keys.has("KeyX")) lightZ -= LIGHT_STEP;

  elapse += WAVE_ANIM_SPEED;
  rippleState.elapse = elapse;
  rippleState.waveType = waveType;
  rippleMat.setFloat("uElapse", elapse);
  rippleMat.setFloat("uWaveType", waveType);

  // 回転はimageのロード完了後に反映
  if (image_loaded) {
    const rotX = Matrix.RotationX(Tools.ToRadians(rotateX));
    const rotY = Matrix.RotationY((useRightHandedSystem ? 1.0 : -1.0) * Tools.ToRadians(rotateY));
    const rotZ = Matrix.RotationZ(0.0);
    scenePivot.rotationQuaternion = Quaternion.FromRotationMatrix(rotZ.multiply(rotY.multiply(rotX)));
    scenePivot.computeWorldMatrix(true);
  }

  lightHelper.position.set(lightX, lightY - lookY, lightZ);
  scenePivot.computeWorldMatrix(true);
  lightHelper.computeWorldMatrix(true);
  const transLight = lightHelper.getAbsolutePosition();
  light.position.copyFrom(transLight);
  const tgt = new Vector3(0.0, lookY, 0.0);
  const toT = tgt.subtract(transLight);
  if (toT.lengthSquared() > 1e-10) {
    toT.normalize();
    light.direction.copyFrom(toT);
  }

  reflectPlane.computeWorldMatrix(true);
  {
    const wm = reflectPlane.getWorldMatrix();
    const worldPos = Vector3.TransformCoordinates(Vector3.Zero(), wm);
    const worldNor = Vector3.TransformNormal(new Vector3(0.0, 1.0, 0.0), wm);
    worldNor.normalize();
    worldNor.scaleInPlace(-1);
    mirror.mirrorPlane = Plane.FromPositionAndNormal(worldPos, worldNor);
  }
  refreshMirrorRenderList();

  camera.setTarget(new Vector3(0.0, lookY, 0.0));
  // getReflectionTextureMatrixはscene.getProjectionMatrix()（PROJECTION_MODE）を参照する。
  // render前は未初期化のため、カメラの投影を反映してから更新する。
  scene.updateTransformMatrix(true);
  rippleMat.setMatrix("view", camera.getViewMatrix());
  rippleMat.setMatrix("textureMatrix", mirror.getReflectionTextureMatrix());

  scene.render();

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("waveType " + waveType, 0, 24);
  context.fillText("rotateX " + rotateX.toFixed(1), 0, 48);
  context.fillText("rotateY " + rotateY.toFixed(1), 0, 72);
  context.fillText("lightX " + lightX.toFixed(1), 0, 96);
  context.fillText("lightY " + lightY.toFixed(1), 0, 120);
  context.fillText("lightZ " + lightZ.toFixed(1), 0, 144);
});

let mouseDown = false;
let mouseX = 0;
let mouseY = 0;
scene.onPointerObservable.add((pointerInfo) => {
  const e = pointerInfo.event;
  if (pointerInfo.type === PointerEventTypes.POINTERDOWN) {
    mouseDown = true;
    mouseX = e.clientX;
    mouseY = e.clientY;
  } else if (pointerInfo.type === PointerEventTypes.POINTERUP) {
    mouseDown = false;
  } else if (pointerInfo.type === PointerEventTypes.POINTERMOVE) {
    if (!mouseDown) return;
    rotateX += (e.clientY - mouseY) / 2.0;
    rotateY += (e.clientX - mouseX) / 2.0;
    mouseX = e.clientX;
    mouseY = e.clientY;
  }
});
scene.onKeyboardObservable.add((kbInfo) => {
  if (kbInfo.type !== KeyboardEventTypes.KEYDOWN) return;
  const code = kbInfo.event.code;
  if (code === "Digit1" || code === "Numpad1") waveType = 0;
  else if (code === "Digit2" || code === "Numpad2") waveType = 1;
  else if (code === "Digit3" || code === "Numpad3") waveType = 2;
});
</script>

    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); pointer-events:none" width="640" height="480"></canvas>
  </div>
