<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script type="importmap">
{
  "imports": {
    "@babylonjs/core": "./node_modules/@babylonjs/core/index.js",
    "@babylonjs/core/": "./node_modules/@babylonjs/core/",
    "@babylonjs/loaders": "./node_modules/@babylonjs/loaders/index.js",
    "@babylonjs/loaders/": "./node_modules/@babylonjs/loaders/"
  }
}
</script>
<script type="module">
import { Color3, Color4, DirectionalLight, Engine, HemisphericLight, Matrix, MeshBuilder, Quaternion, Scene, StandardMaterial, Tools, UniversalCamera, Vector3 } from "@babylonjs/core";
import { applyDiffuse, applySmoothShading, applyStandardSpecular, loadObjMtl } from "./loadObjMtl.js";
import { runRenderLoop, useRightHandedSystem } from "./common.js";

const MODEL_DIR = "./model/";

const FRAME_INTERVAL_MS = 1000 / 30/*フレーム*/;

const AMBIENT_LIGHT_COEF = 0.33; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 1.66; // d2js版と見た目が同じになるように係数をかける

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const engine = new Engine(canvas3d, true);
engine.setHardwareScalingLevel(1 / window.devicePixelRatio);

const scene = new Scene(engine);
if (useRightHandedSystem) scene.useRightHandedSystem = true;
scene.clearColor = new Color4(0.0, 0.0, 1.0, 1.0);

const camera = new UniversalCamera("cam", new Vector3(0.0, 0.0, 0.0), scene);
camera.minZ = 0.1;
camera.maxZ = 100.0;
camera.fov = Math.PI / 4.0; // 45deg
camera.setTarget(new Vector3(0.0, 0.0, useRightHandedSystem ? -1.0 : 1.0));

(async () => {
  try {
    const sphere = await loadObjMtl(scene, MODEL_DIR, "sphere");
    applyDiffuse(sphere, new Color3(0.95, 0.95, 0.95)); // StandardMaterialのdiffuseColorに相当
    applyStandardSpecular(sphere, new Color3(0.5, 0.5, 0.5), 50.0); // StandardMaterialのspecularColor/specularPowerに相当
    applySmoothShading(sphere);
    sphere.scaling.setAll(0.015);
    sphere.position.set(0.0, 0.0, useRightHandedSystem ? -6.0 : 6.0);
    const rotS = useRightHandedSystem ? 1.0 : -1.0;
    const rotX = Matrix.RotationX(rotS * Tools.ToRadians(45.0));
    const rotY = Matrix.RotationY(rotS * Tools.ToRadians(30.0));
    const rotZ = Matrix.RotationZ(rotS * Tools.ToRadians(15.0));
    sphere.rotationQuaternion = Quaternion.FromRotationMatrix(rotX.multiply(rotY.multiply(rotZ))); // Rz*Ry*Rx
  } catch (e) {
    console.error(e);
  }
})();

const hemi = new HemisphericLight("h", new Vector3(0.0, 1.0, 0.0), scene);
hemi.diffuse = Color3.White();
hemi.groundColor = Color3.White();
hemi.intensity = 0.6 * AMBIENT_LIGHT_COEF;

// Three: light.position.set(0.85, 0.8, 0.75) - BabylonのDirectionalLightは光線の進行方向 = -position（+positionを渡すと明るい位置が画面で反対側になる）
const lightVec = useRightHandedSystem
  ? new Vector3(0.85, 0.8, 0.75).negate().normalize()
  : new Vector3(-0.85, -0.8, 0.75).normalize();
const light = new DirectionalLight("d", lightVec, scene);
light.intensity = 0.5 * DIRECTIONAL_LIGHT_COEF;

runRenderLoop(engine, FRAME_INTERVAL_MS, () => {
  scene.render();

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("Hello World !!", 0, 24);
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); width:640px; height:480px"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
