<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title></title>
<script src="texture_sample1.js"></script>
<script type="importmap">
{
  "imports": {
    "@babylonjs/core": "./node_modules/@babylonjs/core/index.js",
    "@babylonjs/core/": "./node_modules/@babylonjs/core/"
  }
}
</script>
<script type="module">
import { Color3, Color4, DirectionalLight, Engine, HemisphericLight, Matrix, MeshBuilder, PBRMaterial, Quaternion, Scene, Texture, Tools, UniversalCamera, Vector3 } from "@babylonjs/core";
import { myRunRenderLoop, useRightHandedSystem } from "./common.js";

const useDataUrl = false;

const FRAME_PER_SECOND = 30/*フレーム*/;

const AMBIENT_LIGHT_COEF = 1.0; // d2js版と見た目が同じになるように係数をかける
const DIRECTIONAL_LIGHT_COEF = 2.0; // d2js版と見た目が同じになるように係数をかける
const SPECULAR_COLOR_COEF = 0.2; // d2js版と見た目が同じになるように係数をかける

// map * colorを白に近づけてテクスチャを残す（Three MeshPhong color.lerpと対応）
const DIFFUSE_BLEND = 0.75;

const canvas3d = document.getElementById("hoge_canvas");
const canvas2d = document.getElementById("fuga_canvas");

const useSmooth = false;
const diffuse = new Color3(1.0, 0.0, 1.0);
const useEmission = false;
const emissionColor = new Color3(1.0, 0.0, 1.0);
const emissionIntensity = 0.75;

const engine = new Engine(canvas3d, true);
engine.setHardwareScalingLevel(1 / window.devicePixelRatio);

const scene = new Scene(engine);
if (useRightHandedSystem) scene.useRightHandedSystem = true;
scene.clearColor = new Color4(0.0, 0.0, 1.0, 1.0);

const camera = new UniversalCamera("cam", new Vector3(0.0, 0.0, 3.0), scene);
camera.minZ = 0.1;
camera.maxZ = 100.0;
camera.fov = Math.PI / 4.0; // 45deg
camera.setTarget(new Vector3(0.0, 0.0, 0.0));

const mesh = MeshBuilder.CreateBox("box", { size: 2, flat: !useSmooth }, scene);

// PBR：Physically Based Rendering（物理ベースレンダリング）
// PBRマテリアル：「Physically Based Rendering（物理ベースレンダリング）」を実現するためのマテリアル
// PBRMaterialでThreeのMeshPhong的な見た目に寄せる
const material = new PBRMaterial("pbr", scene);
// StandardMaterialのdiffuseTexture/diffuseColorに相当するのはalbedoTexture/albedoColor
material.albedoTexture = new Texture(useDataUrl ? img_src : "texture/sample1.png", scene, true, false, Texture.BILINEAR_SAMPLINGMODE); // ミップOFF + 線形（invertY false：Three flipY=true と同系の見え方）
material.albedoColor = Color3.Lerp(diffuse, Color3.White(), 1.0 - DIFFUSE_BLEND);
// 金属ではない誘電体（diffuse中心）としてセットアップ
material.metallic = 0.0;
material.roughness = 0.5; // specularPower=50相当のざらつき（小さいほどハイライトが鋭い）
// スペキュラ強度をStandardMaterial版（0.7 * SPECULAR_COLOR_COEF）に近づける（誘電体F0の調整）
material.metallicF0Factor = 0.7 * SPECULAR_COLOR_COEF;
// 環境テクスチャを使わないので、反射ではなくライト由来のスペキュラのみになる
material.environmentIntensity = 1.0;
if (useEmission) {
  // PBRMaterialはemissiveがalbedo乗算とは独立に加算され、emissiveIntensityも有効
  material.emissiveColor = emissionColor;
  material.emissiveIntensity = emissionIntensity;
} else {
  material.emissiveColor = Color3.Black();
  material.emissiveIntensity = 0.0;
}
mesh.material = material;

mesh.position.set(0.0, 0.0, -3.0);
const rotS = useRightHandedSystem ? 1.0 : -1.0;
const rotX = Matrix.RotationX(rotS * Tools.ToRadians(45.0));
const rotY = Matrix.RotationY(rotS * Tools.ToRadians(30.0));
const rotZ = Matrix.RotationZ(rotS * Tools.ToRadians(15.0));
mesh.rotationQuaternion = Quaternion.FromRotationMatrix(rotX.multiply(rotY.multiply(rotZ))); // Rz*Ry*Rx

const hemi = new HemisphericLight("h", new Vector3(0.0, 1.0, 0.0), scene);
hemi.diffuse = Color3.White();
hemi.groundColor = Color3.White();
hemi.intensity = 0.6 * AMBIENT_LIGHT_COEF;
// Threeでのlight.position.set(0.85, 0.8, 0.75) - BabylonのDirectionalLightは光線の進行方向 = -position
const lightVec = useRightHandedSystem
  ? new Vector3(0.85, 0.8, 0.75).negate().normalize()
  : new Vector3(0.85, -0.8, -0.75).normalize();
const light = new DirectionalLight("d", lightVec, scene);
light.intensity = 0.5 * DIRECTIONAL_LIGHT_COEF;

myRunRenderLoop(engine, FRAME_PER_SECOND, () => {
  scene.render();

  // 2Dグラフィック画面の描画
  const context = canvas2d.getContext("2d");
  context.clearRect(0, 0, canvas2d.width, canvas2d.height);
  context.font = "24px 'MS Gothic', sans-serif";
  context.fillStyle = "rgb(255, 0, 255)";
  context.fillText("Hello World !!", 0, 24);
});
</script>
</head>
<body>
<div align="center">
  <div style="position:relative">
    <canvas id="hoge_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0); width:640px; height:480px"></canvas>
    <canvas id="fuga_canvas" style="position:absolute; left:50%; transform:translate(-50%, 0)" width="640" height="480"></canvas>
  </div>
</div>
</body>
</html>
